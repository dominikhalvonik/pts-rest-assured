# Adresa WEBOVEJ aplikácie, nie cesta ku /cart/quote.
base.url=http://127.0.0.1:8080/
timeout.seconds=30
# api = nový run-* priestor pred KAŽDÝM testom, po teste odstránenie iba tohto priestoru.
# Testovací kľúč iba na vlastnom/lokálnom serveri alebo v dôveryhodnej CI.
fixtures.mode=api
# Prednosť má premenná prostredia TEST_API_KEY. Kľúč musí zodpovedať PHP configu.
test.api.key=SEM_NAHODNY_KLUC_ASPON_32_ZNAKOV
# Nastavte true iba v izolovanom laboratóriu, keď máte lokálny backend cez HTTP.
allow.http=true
